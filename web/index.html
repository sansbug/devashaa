        <h1>Devashaa — Vedic Birth Chart (Jyotiṣa)</h1>
        <p>
          <strong>Devashaa</strong> is a free, non-commercial, educational
          sidereal Vedic astrology (Jyotiṣa) birth-chart calculator and reference.
          From a birth date, time and place it computes an astronomical horoscope
          using the Swiss Ephemeris (JPL DE431), following the classical Sanskrit
          text <em>Bṛhat Parāśara Horā Śāstra</em> (BPHS) with scholarly citations.
          It uses the sidereal zodiac with the Lahiri ayanāṁśa and whole-sign bhāvas.
        </p>

        <h2>What it computes</h2>
        <ul>
          <li>The lagna (ascendant), the rāśi (D1) chart, and all sixteen
            divisional charts (ṣoḍaśavarga) — navāṁśa, daśāṁśa and the rest.</li>
          <li>The nine grahas with their degrees, dignities and graha dṛṣṭi (aspects).</li>
          <li>The twenty-seven nakṣatras with their pādas.</li>
          <li>Eight nakṣatra daśā systems (Viṁśottarī and the udu daśās), plus the
            Jaimini Chara Daśā, a sign-based daśā.</li>
        </ul>

        <h2>Reference material</h2>
        <p>
          Alongside the calculator, Devashaa is a reference on the twelve rāśis and
          the twenty-seven nakṣatras — their attributes (symbol, gaṇa, yoni,
          puruṣārtha, śakti and more), each labelled by provenance — and the classical
          interaction techniques, attributed to their sources.
        </p>

        <h2>Approach</h2>
        <p>
          Every rule is traced to its source and tiered by provenance — what
          <em>Bṛhat Parāśara Horā Śāstra</em> states, versus the wider traditional
          canon, versus modern authors — and the tiers are never conflated; where a
          text is silent, the site says so rather than guessing. Planetary positions
          come from the Swiss Ephemeris.
        </p>
        <p>
          This is a general-audience educational and reference resource. It has no
          advertising, no gambling, no adult content and no payments; an optional
          encrypted profile-save is the only account feature. The interactive chart
          calculator itself requires JavaScript.
        </p>
